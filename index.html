.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #e5e7eb}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd}
